# Required
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/source/conf.py

# Optionally build your docs in additional formats such as PDF and ePub
formats: all

# Optionally set the Python package extras required to build your docs
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
