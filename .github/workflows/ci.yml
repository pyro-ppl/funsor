name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  default:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    env:
      CI: 1
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
    - name: Install dependencies
      run: |
        sudo apt install -y pandoc
        uv venv --python ${{ matrix.python-version }}
        # Keep track of pyro-api master branch
        uv pip install https://github.com/pyro-ppl/pyro-api/archive/master.zip
        uv pip install ".[test]"
        uv pip freeze
    - name: Run test
      run: uv run --no-sync make test


  torch:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    env:
      CI: 1
      FUNSOR_BACKEND: torch
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
    - name: Install dependencies
      run: |
        uv venv --python ${{ matrix.python-version }}
        # Keep track of pyro-api master branch
        uv pip install https://github.com/pyro-ppl/pyro-api/archive/master.zip
        uv pip install torch==2.4.1 torchvision==0.19.1 --index-url https://download.pytorch.org/whl/cpu
        # Keep track of Pyro master branch
        uv pip install https://github.com/pyro-ppl/pyro/archive/master.zip
        uv pip install ".[test,torch]"
        uv pip freeze
    - name: Run test
      run: uv run --no-sync make test


  jax:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    env:
      CI: 1
      FUNSOR_BACKEND: jax
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
    - name: Install dependencies
      run: |
        uv venv --python ${{ matrix.python-version }}
        # Keep track of pyro-api master branch
        uv pip install https://github.com/pyro-ppl/pyro-api/archive/master.zip
        uv pip install "jax<0.10"
        # Keep track of NumPyro master branch
        uv pip install https://github.com/pyro-ppl/numpyro/archive/master.zip
        uv pip install ".[test]"
        uv pip freeze
    - name: Run test
      run: uv run --no-sync make test
