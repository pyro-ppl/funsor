# Required
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  apt_packages:
    - pandoc
  jobs:
    # Override install so we can use pip dependency groups (requires pip >= 25.1).
    # Preinstall CPU torch wheels so RTD does not pull CUDA builds; then install
    # the project with the torch extra (for autodoc of funsor.torch / funsor.pyro)
    # plus the docs dependency group.
    install:
      - pip install --upgrade pip
      - pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - pip install .[torch] --group docs

sphinx:
  configuration: docs/source/conf.py
